[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autorun-workspace"
version = "1.0.0rc1"
description = "UV workspace for autorun plugins: autorun, pdf-extractor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Andrew Hundt", email = "ATHundt@gmail.com"},
]
keywords = ["claude", "claude-code", "marketplace", "plugin-workspace", "autorun", "pdf-extractor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# No dependencies - this is a workspace definition, not a real package
# CLI entry points come from plugins/autorun/pyproject.toml
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.14.1",
]
# One distribution. PDF extraction is `autorun-ai[pdf]`, not a second package.
# The requirement names the *distribution*, so it must track the rename or
# `uv lock` reports "autorun-workspace[all]'s requirements are unsatisfiable".
all = [
    "autorun-ai[pdf,pdf-gpu,pdf-llm,pdf-progress]>=0.10.0",
]

# NO [project.scripts] - scripts come from plugins/autorun/pyproject.toml

[project.urls]
Homepage = "https://github.com/ahundt/autorun"
Repository = "https://github.com/ahundt/autorun.git"
Issues = "https://github.com/ahundt/autorun/issues"

[tool.uv]
constraint-dependencies = [
    # onnxruntime 1.24+ publishes no cp310 wheels while still declaring
    # requires-python >=3.10, so an unconstrained lock selects an
    # uninstallable version for the <3.11 fork (reached through the pdf
    # extra: markitdown -> magika -> onnxruntime). 1.23.2 is the newest
    # release with a cp310 wheel.
    "onnxruntime<1.24; python_version < '3.11'",
]

[tool.uv.workspace]
# plugins/pdf-extractor is deliberately absent: it is a Claude marketplace
# plugin, not a Python distribution. Its code stays in that directory and
# reaches this wheel through the plugins/autorun/src/pdf_extraction symlink.
members = [
    "plugins/autorun",
]

[tool.uv.sources]
# Key must be the member's *distribution* name, which is "autorun-ai" even
# though the directory, the import package and the console script are all
# "autorun". Spelling the directory name here resolves the member from PyPI
# instead of the local tree, which
# test_the_pdf_plugin_ships_inside_autorun_and_not_beside_it asserts against.
autorun-ai = { workspace = true }

# Minimal stub package for UV workspace
[tool.hatch.build.targets.wheel]
packages = ["src/autorun_workspace"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/plugins",
    "/README.md",
    "/pyproject.toml",
    "/.claude-plugin",
]

[tool.setuptools]
# This package uses hatchling, not setuptools
# This section is for metadata compatibility only

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
