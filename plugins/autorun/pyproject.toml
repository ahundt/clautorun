[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is "autorun-ai"; the project, the console script, the import
# package and the marketplace plugin are all still "autorun", and the harness
# command prefix is "ar". PyPI prohibits the bare name "autorun" -- registering
# it returns "This project name isn't allowed", the wording reserved for names
# blocked by administrators, most plausibly because `autorun` collides with the
# Windows autorun.inf convention. Only the PyPI-facing name moved.
name = "autorun-ai"
version = "1.0.0rc1"
description = "Task lifecycle and safety hooks for AI coding harnesses"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Andrew Hundt", email = "ATHundt@gmail.com"},
]
keywords = ["claude", "autorun", "task-lifecycle", "cli", "safety-hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "bashlex>=0.18",
    "psutil",
    # filelock 3.29.5+ leaves a lock inode after failed installer preflight;
    # that violates the no-durable-write contract. Do not unlink live locks.
    "filelock>=3.12.0,<3.29.5",
    # Frontmatter is YAML. Three hand-written subset parsers used to read it and
    # each understood a different subset; command_docs.split_frontmatter is the
    # single reader now, and it imports this lazily so no hook pays for it.
    "pyyaml>=6.0",
    # Version ranges in bug-workaround flags (">=2.1.233,<2.2") are compared
    # with packaging's SpecifierSet/Version rather than a hand-rolled dotted
    # compare, which gets pre-releases and epochs wrong. config.py imports it
    # lazily, only when a flag actually holds a range, so the ordinary
    # always/never/auto path pays no import on the hook's dispatch budget.
    "packaging>=23.0",
]
# Runtime policy: Python is the only runtime autorun installs. JavaScript runs
# only inside OpenCode and Pi, whose own in-process extension loaders provide
# Bun or Node. Their adapters share one transport module. Do not add a second
# runtime to external hook paths: it would cost Claude and Codex users a
# dependency they do not need.

[project.optional-dependencies]
# PDF extraction ships inside this distribution rather than beside it. The
# `pdf-extractor` marketplace plugin keeps its own directory, manifest, commands,
# skill, source and tests; it is simply not a separate Python package, so there
# is one thing to publish, one version, and one install. `plugins/autorun/src/
# pdf_extraction` is a symlink into that plugin, which setuptools follows when
# it collects packages.
#
# Every backend imports inside its own extract() call, backend_availability()
# reports a missing one as unavailable, and extract_single_pdf names the extra
# to install when none is present. So `autorun` installs and imports with no
# extraction library at all, and each user pays only for the backends they
# pick. `uv tool install 'autorun[pdf]'` is the ordinary choice.
# Pure-Python and small-wheel backends. No GPU, no model downloads.
pdf = [
    # markitdown's magika/onnxruntime chain has no cp314 artifact yet.
    "markitdown>=0.1.0; python_version < '3.14'",
    "pdfplumber>=0.10.0",
    # pdfplumber pulls Pillow transitively; keep the optional CPU graph above
    # the first release that fixes all advisories known at this release gate.
    "pillow>=12.3.0",
    "pdfminer.six>=20221105",
    # The CLI backend id remains `pypdf2` for compatibility, but PyPDF2 is
    # retired and has no patched release for its known advisory.
    "pypdf>=6.0.0",
]
pdf-gpu = [
    # docling's macOS standard model stack still pins an advisory-affected
    # transformers 4.x. Keep the published extra safe until upstream lifts it.
    "docling>=2.94.0; sys_platform != 'darwin'",
    # marker-pdf is intentionally not selected: its supported-platform
    # dependency graph pins Pillow below the first fully patched release.
]
pdf-llm = ["pymupdf4llm>=0.0.1"]
# extractors.py falls back to a no-op progress bar when tqdm is absent.
pdf-progress = ["tqdm>=4.60.0"]
# A self-referential extra names this distribution, so it tracks the rename.
pdf-all = ["autorun-ai[pdf,pdf-gpu,pdf-llm,pdf-progress]"]
# There is no `dev` extra. The dev environment is `[dependency-groups].dev`
# below, which uv includes by default in `uv run` and `uv sync`. Publishing a
# second one drifted immediately: the extra floored pytest at 7 and shipped
# black and mypy, while the group floors it at 8.4.2 and carries pytest-timeout
# and pytest-xdist — so anything run with `--extra dev` had neither the timeout
# plugin this file configures nor the xdist its addopts name.

[tool.uv]
# WARNING: Do NOT add deprecated fields here (e.g., default-extras).
# UV versions may remove fields, causing stderr warnings when hooks run.
# Claude Code treats ANY hook stderr as "hook error" and ignores the hook
# response (fail-open), which silently disables ALL hook protections.
# If you need to add default extras, put them in [project] dependencies instead.
# Regression test: test_hook_entry.py::TestUVCompatibility

[project.scripts]
autorun = "autorun.__main__:main"
autorun-install = "autorun.install:install_main"
# A console script cannot be conditional on an extra, so this always ships.
# Without `[pdf]` it still works through the system `pdftotext`, and names the
# extra to install when there is no usable backend at all.
extract-pdfs = "pdf_extraction.cli:main"

[project.urls]
Homepage = "https://github.com/ahundt/autorun"
Repository = "https://github.com/ahundt/autorun.git"
Issues = "https://github.com/ahundt/autorun/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
autorun = ["metadata.json"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# cli.py has intentional late imports for standalone script execution support
"src/pdf_extraction/cli.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # conftest.py marks the shelve, daemon and tmux modules with `xdist_group`
    # so each resource class lands on one worker. `-n N` alone would promote
    # `--dist` from its "no" default to "load", which schedules by test and
    # ignores those marks -- several workers then drove the one shared private
    # tmux server at once and three tmux tests failed on send_keys. Pinned here
    # rather than left to the caller because the grouping is a correctness
    # property, not a tuning choice, and a forgotten flag disarms it silently.
    # At zero workers pytest-xdist forces "no", so serial runs are unaffected.
    "--dist=loadgroup",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "plugin: marks tests as plugin tests",
    "hook: marks tests as hook tests",
    "interactive: marks tests as interactive tests",
    "slow: marks tests that take >5s (ThreadSafeDB concurrency, etc.)",
    "subprocess: marks tests that spawn subprocesses",
    "tmux: marks tests that require tmux sessions",
    "e2e: marks end-to-end tests (may require Gemini CLI, real API calls)",
    "real_money: marks tests that call a paid model API (AUTORUN_ENABLE_TESTS_THAT_COST_REAL_MONEY=1); `-m \"not real_money\"` proves none were collected",
    "daemon: marks tests that require a running daemon process",
    "serial: marks tests that must run serially (not in parallel)",
    "stress: marks stress tests",
    "race: marks race condition tests",
    "benchmark: marks storage cost measurements (AUTORUN_ENABLE_STATE_BENCHMARK=1)",
    "release: builds and installs clean release artifacts in an isolated environment",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["plugins/autorun/src/autorun", "src/autorun"]
omit = [
    # Entry points and system integration
    "**/install.py",
    "**/python_check.py",
    "**/diagnostics.py",
    "**/__main__.py",
    # External system integration (requires tmux)
    "**/tmux_injector.py",
    "**/tmux_utils.py",
    # AI monitoring (requires running sessions)
    "**/ai_monitor.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Exclude fallback code in __init__.py
    "except ImportError:",
    "# Fallback",
    "# If session manager can't be imported",
    "raise ImportError",
    # Exclude try/except blocks that handle optional dependencies
    "except Exception as e:",
    "except Exception:",
    # Exclude logging calls
    "log_info\\(",
    # Exclude pass statements in exception handlers
    "pass  # Silently",
    "pass  # pragma",
]
fail_under = 75

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.1.0",
    # Two thirds of the suite's wall time is 6,000+ tests averaging 31ms, which
    # is exactly the shape that distributes well; only 45 tests exceed half a
    # second. Workers are separate processes, so conftest.py's per-process
    # mkdtemp already isolates their runtime state.
    "pytest-xdist>=3.6.0",
]
